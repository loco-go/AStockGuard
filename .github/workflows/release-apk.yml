name: Build and Publish APK

on:
  push:
    branches:
      - master
      - feature/v3.4-release-echarts-trade-ui
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify
        run: |
          ./gradlew test
          ./gradlew lint

      - name: Build installable APK
        run: ./gradlew assembleDebug

      - name: Prepare release metadata
        id: meta
        shell: bash
        run: |
          VERSION=$(grep -m1 'versionName = ' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          SHORT_SHA=${GITHUB_SHA::7}
          TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          APK="AStockGuard-${VERSION}-${SHORT_SHA}-dev.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          NOTES=$(cat <<'EOF'
          Automated Android build.

          - test + lint completed before publishing
          - APK is installable and intended for development/validation
          - production signing will use a fixed release keystore once repository signing secrets are configured
          EOF
          )
          if [[ "${GITHUB_REF_NAME}" == "master" ]]; then
            gh release create "${{ steps.meta.outputs.tag }}" "${{ steps.meta.outputs.apk }}" \
              --target "$GITHUB_SHA" \
              --title "AStockGuard ${{ steps.meta.outputs.version }}" \
              --notes "$NOTES"
          else
            gh release create "${{ steps.meta.outputs.tag }}" "${{ steps.meta.outputs.apk }}" \
              --target "$GITHUB_SHA" \
              --title "AStockGuard ${{ steps.meta.outputs.version }} development build" \
              --notes "$NOTES" \
              --prerelease
          fi
